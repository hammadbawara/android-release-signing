name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        type: string

jobs:
  publish:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Run Tests
        run: ./gradlew :android-build-logic:test --no-daemon

      - name: Publish to Local Staging Repository
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: |
          ./gradlew :android-build-logic:publishAllPublicationsToStagingRepository \
            -Pversion=${{ steps.get_version.outputs.RELEASE_VERSION }} \
            --no-daemon --stacktrace

      - name: Create Bundle ZIP
        run: |
          cd android-build-logic/build/staging-repo
          zip -r ../bundle.zip .
          ls -la ../bundle.zip

      - name: Upload Bundle to Maven Central Portal
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          AUTH_TOKEN=$(printf "%s:%s" "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64 -w 0)
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" \
            --request POST \
            --header "Authorization: Bearer ${AUTH_TOKEN}" \
            --form "bundle=@android-build-logic/build/bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC")
          
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1)

          echo "Central Portal response status: $HTTP_STATUS"
          echo "Central Portal response body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ne 201 ] && [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Upload to Central Portal failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
          echo "Successfully uploaded deployment to Central Portal: $HTTP_BODY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release v${{ steps.get_version.outputs.RELEASE_VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
